name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/postgres-wireflow-persistence, feat/wireflow-immutable-revisions]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wireflow
          POSTGRES_USER: wireflow
          POSTGRES_PASSWORD: wireflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wireflow -d wireflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_INTEGRATION_URL: postgres://wireflow:wireflow@localhost:5432/wireflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
